<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- ================= SCHOOL INFO BAR ================= -->
    <div
      class="flex flex-col md:flex-row md:flex-wrap items-center justify-center md:justify-evenly bg-black text-white py-4 px-4 gap-4 text-sm md:text-base"
    >
      <!-- Phone -->
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-phone"></i>
        <span class="font-semibold">9807546446</span>
      </div>

      <!-- Email -->
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-envelope"></i>
        <span class="font-semibold">motherteresarayagada@gmail.com</span>
      </div>

      <!-- Location -->
      <div class="flex items-center gap-2 text-center md:text-left">
        <i class="fa-solid fa-location-dot"></i>
        <span class="font-semibold">
          Kholliguda, Rayagada, Odisha - 765017
        </span>
      </div>

      <!-- Social Icons -->
      <div class="flex items-center gap-4 text-xl">
        <!-- Facebook -->
        <a
          href="#"
          aria-label="Facebook"
          class="text-[#1877F2] hover:scale-110 transition"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <!-- LinkedIn -->
        <a
          href="#"
          aria-label="LinkedIn"
          class="text-[#0A66C2] hover:scale-110 transition"
        >
          <i class="fa-brands fa-linkedin-in"></i>
        </a>

        <!-- Twitter (X) -->
        <a
          href="#"
          aria-label="Twitter"
          class="text-[#1DA1F2] hover:scale-110 transition"
        >
          <i class="fa-brands fa-twitter"></i>
        </a>

        <!-- Instagram -->
        <a
          href="#"
          aria-label="Instagram"
          class="text-[#E4405F] hover:scale-110 transition"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </div>
  </body>
</html>
